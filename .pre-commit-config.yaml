repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.0.0
    hooks:
      - id: sqlfluff-lint
        args: [--dialect, postgres, --templater, jinja]
      - id: sqlfluff-fix
        args: [--dialect, postgres, --templater, jinja]

  - repo: local
    hooks:
      - id: sqlglot
        name: sqlglot SQL validation
        entry: python validate_sql.py
        language: python
        files: \.sql$
        additional_dependencies: [sqlglot]